[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgsfnet-pgrcl"
version = "1.0.0"
description = "CGSFNet and PGR-CL for continual sheep face identification across growth stages"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Suhui Liu"}]
dependencies = [
  "numpy==1.24.4",
  "pandas==1.5.3",
  "Pillow==10.4.0",
  "PyYAML==6.0.1",
  "scipy==1.10.1",
  "scikit-learn==1.3.2",
  "torch==2.0.1",
  "torchvision==0.15.2",
]

[project.optional-dependencies]
pretrained = ["huggingface-hub==0.24.7"]
test = ["pytest==8.3.5"]

[project.scripts]
cgsfnet-pgrcl = "pgrcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

